<svg viewBox="0 0 200 250" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Tsuzuki mascot">
  <defs>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4A417F"/>
      <stop offset="1" stop-color="#2B2650"/>
    </linearGradient>
    <linearGradient id="hoodie" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4B3D86"/>
      <stop offset="1" stop-color="#332A5E"/>
    </linearGradient>
    <linearGradient id="tri" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF8FB3"/>
      <stop offset="1" stop-color="#FF5C8D"/>
    </linearGradient>
  </defs>

  <!-- back hair -->
  <path d="M38 108 Q30 42 100 36 Q170 42 162 108 L164 200 Q142 186 132 196 L130 128 L70 128 L68 196 Q58 186 36 200 Z" fill="url(#hair)"/>

  <!-- twin-tail tufts -->
  <path d="M36 118 Q16 150 26 188 Q40 168 44 138 Z" fill="url(#hair)"/>
  <path d="M164 118 Q184 150 174 188 Q160 168 156 138 Z" fill="url(#hair)"/>

  <!-- neck: tucked under the chin, softened at the shoulders -->
  <path d="M89 138 L111 138 L111 158 Q100 165 89 158 Z" fill="#EFC0AB"/>

  <!-- hoodie -->
  <path d="M54 250 Q54 176 100 164 Q146 176 146 250 Z" fill="url(#hoodie)"/>
  <path d="M100 166 Q88 172 84 182 Q94 178 100 174 Q106 178 116 182 Q112 172 100 166 Z" fill="#2A2350" opacity=".55"/>
  <path d="M100 182 L93 198 L100 207 L107 198 Z" fill="#5BE9E9" opacity=".85"/>

  <!-- face -->
  <ellipse cx="100" cy="100" rx="47" ry="46" fill="#FFE3D4"/>

  <!-- bangs -->
  <path d="M52 96 Q50 46 100 42 Q150 46 148 96 Q142 70 120 64 Q110 84 94 64 Q70 70 60 96 Z" fill="url(#hair)"/>

  <!-- ahoge -->
  <path d="M96 43 Q102 22 120 19 Q104 30 106 44 Z" fill="url(#hair)"/>

  <!-- eyes -->
  <ellipse cx="77" cy="107" rx="10.5" ry="13" fill="#241F45"/>
  <ellipse cx="123" cy="107" rx="10.5" ry="13" fill="#241F45"/>
  <ellipse cx="77" cy="110" rx="8.5" ry="9" fill="#7B6BE0"/>
  <ellipse cx="123" cy="110" rx="8.5" ry="9" fill="#7B6BE0"/>
  <circle cx="80.5" cy="102" r="4.2" fill="#FFFFFF"/>
  <circle cx="126.5" cy="102" r="4.2" fill="#FFFFFF"/>
  <circle cx="73" cy="114" r="2" fill="#FFFFFF" opacity=".75"/>
  <circle cx="119" cy="114" r="2" fill="#FFFFFF" opacity=".75"/>

  <!-- brows -->
  <path d="M67 90 Q77 86 87 89" stroke="#3B3468" stroke-width="2.6" fill="none" stroke-linecap="round"/>
  <path d="M113 89 Q123 86 133 90" stroke="#3B3468" stroke-width="2.6" fill="none" stroke-linecap="round"/>

  <!-- blush -->
  <ellipse cx="62" cy="119" rx="9" ry="5.5" fill="#FF9DBB" opacity=".55"/>
  <ellipse cx="138" cy="119" rx="9" ry="5.5" fill="#FF9DBB" opacity=".55"/>

  <!-- mouth -->
  <path d="M93 124 Q100 131 107 124" stroke="#C2687A" stroke-width="2.6" fill="none" stroke-linecap="round"/>

  <!-- play-triangle hair clip -->
  <path d="M132 60 L132 76 L146 68 Z" fill="url(#tri)"/>

  <!-- sparkle -->
  <path d="M46 62 L48.4 68.6 L55 71 L48.4 73.4 L46 80 L43.6 73.4 L37 71 L43.6 68.6 Z" fill="#FFF3B0" opacity=".9"/>
</svg>
